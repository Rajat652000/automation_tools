<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsApp Campaigns</title><style>*{box-sizing:border-box}body{margin:0;background:#f1faf4;color:#14251a;font:15px Segoe UI,Arial}.shell{max-width:980px;margin:auto;padding:42px 20px}.hero{margin-bottom:24px}.eyebrow{color:#168c4b;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:12px}.hero h1{margin:7px 0;font-size:32px}.card{background:#fff;border:1px solid #d9eee0;border-radius:18px;padding:26px;box-shadow:0 12px 35px #14532d12}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}label{display:block;font-weight:650;color:#344054}input,textarea{width:100%;margin-top:8px;padding:13px 14px;border:1px solid #cfe2d4;border-radius:10px;font:inherit}textarea{min-height:130px}.hint{font-size:12px;color:#667085;margin-top:6px}.notice{background:#e9f8ee;border:1px solid #bde5c9;padding:13px;border-radius:10px;margin-bottom:20px}.actions{text-align:right;margin-top:20px}button{background:#168c4b;border:0;border-radius:10px;color:#fff;padding:13px 20px;font-weight:700;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="shell"><div class="hero"><div class="eyebrow">Official Meta API</div><h1>WhatsApp Campaigns</h1><p>Send approved, consent-based WhatsApp messages.</p></div><section class="card">{% if result %}<div class="notice"><strong>{{ result }}</strong></div>{% endif %}<div class="notice">Maximum 50 recipients. Business-initiated messages may require an approved template.</div><form method="post" enctype="multipart/form-data">{% csrf_token %}<div class="grid"><label>Import contacts JSON<input type="file" name="json_file" accept="application/json"><div class="hint">Expected field: phone</div></label><label>Delay between messages<input type="number" name="delay" value="3" min="1" max="60"></label><label class="full">Phone numbers<textarea name="recipients" placeholder="919876543210&#10;919812345678" required>{{ imported }}</textarea></label><label class="full">Message or approved template body<textarea name="body" required></textarea></label><label class="full">Photo upload (optional)<input type="file" name="image_file" accept="image/jpeg,image/png"><div class="hint">For production WhatsApp, the uploaded image must be hosted at a public HTTPS URL.</div></label><label class="full">Public photo URL (optional)<input type="url" name="image_url" placeholder="https://your-domain.com/photo.jpg"></label></div><label style="margin-top:18px"><input type="checkbox" name="consent" required style="width:auto;margin-right:8px">All recipients opted in.</label><div class="actions"><button type="submit">Start WhatsApp batch</button></div></form></section></main></body></html>
