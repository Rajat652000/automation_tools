{% extends "crm/base.html" %}{% block content %}
<div class="card">
  <h1>Edit transaction</h1>
  <form method="post">
    {% csrf_token %}<label
      >Type<select name="kind">
        <option
          value="sale"
          {%
          if
          transaction.kind=""
          ="sale"
          %}selected{%
          endif
          %}
        >
          Sale
        </option>
        <option
          value="purchase"
          {%
          if
          transaction.kind=""
          ="purchase"
          %}selected{%
          endif
          %}
        >
          Purchase
        </option>
      </select></label
    ><label
      >Item name<input
        name="item_name"
        value="{{transaction.item_name}}"
        required /></label
    ><label
      >Quantity<input
        type="number"
        step="0.01"
        name="quantity"
        value="{{transaction.quantity}}"
        required /></label
    ><label
      >Unit price (₹)<input
        type="number"
        step="0.01"
        name="unit_price"
        value="{{transaction.unit_price}}"
        required /></label
    ><label
      >Date<input
        type="date"
        name="date"
        value="{{transaction.date|date:'Y-m-d'}}"
        required /></label
    ><label
      >Contact<select name="contact">
        <option value="">None</option>
        {% for c in contacts %}
        <option
          value="{{c.id}}"
          {%
          if
          transaction.contact_id=""
          ="c.id"
          %}selected{%
          endif
          %}
        >
          {{c.name}} — {{c.company_name}}
        </option>
        {% endfor %}
      </select></label
    ><label>Note<input name="note" value="{{transaction.note}}" /></label
    ><button>Update transaction</button>
  </form>
</div>
{% endblock %}
