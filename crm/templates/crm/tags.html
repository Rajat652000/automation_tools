{% extends "crm/base.html" %}{% block content %}
<div class="card">
  <h1>Tags</h1>
  <form method="post">
    {% csrf_token %}{{form.as_p}}<button>Create tag</button>
  </form>
  {% for tag in tags %}<span
    class="btn"
    style="display: inline-block; margin: 5px"
    >{{tag.name}}</span
  >{% empty %}
  <p class="muted">No tags yet.</p>
  {% endfor %}
</div>
{% endblock %}
